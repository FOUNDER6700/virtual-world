<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Native WebGL Virtual World</title>
    <style>
        * { box-sizing: border-box; user-select: none; touch-action: none; font-family: sans-serif; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        #hud-top { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; pointer-events: auto; }
        #logo { font-weight: bold; font-size: 1.2rem; color: white; text-shadow: 1px 1px 3px black; }
        
        #joystick-zone { position: absolute; bottom: 0; left: 0; width: 50%; height: 100%; pointer-events: auto; }
        #camera-zone { position: absolute; bottom: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; }
        
        #joystick-base { position: absolute; width: 100px; height: 100px; background: rgba(255,255,255,0.2); border-radius: 50%; display: none; transform: translate(-50%, -50%); pointer-events: none; border: 2px solid rgba(255,255,255,0.4); }
        #joystick-knob { position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; background: rgba(255,255,255,0.7); border-radius: 50%; }
        
        #action-buttons { position: absolute; bottom: 30px; right: 30px; display: flex; gap: 15px; pointer-events: auto; }
        .action-btn { width: 65px; height: 65px; border-radius: 50%; background: rgba(0,0,0,0.5); color: white; border: 2px solid rgba(255,255,255,0.8); font-weight: bold; font-size: 0.8rem; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .action-btn:active { background: rgba(255,255,255,0.8); color: black; }
        
        #error-log { position: absolute; top: 50%; left: 10%; right: 10%; background: rgba(255,0,0,0.8); color: white; padding: 20px; text-align: center; display: none; z-index: 100; border-radius: 10px; font-family: monospace; }
        
        #loading { position: absolute; top:0; left:0; width: 100%; height: 100%; background: #111; z-index: 50; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.5rem; transition: opacity 0.5s; }
    </style>
</head>
<body>

    <div id="loading">ENTERING WORLD...</div>
    <div id="error-log"></div>
    <canvas id="glcanvas"></canvas>

    <div id="ui-layer">
        <div id="hud-top">
            <div id="logo">NATIVE WORLD</div>
        </div>
        
        <div id="joystick-zone"></div>
        <div id="camera-zone"></div>
        
        <div id="joystick-base"><div id="joystick-knob"></div></div>
        
        <div id="action-buttons">
            <button class="action-btn" id="btn-jump">JUMP</button>
        </div>
    </div>

    <script>
        window.onerror = function(msg, url, line) {
            const err = document.getElementById('error-log');
            err.style.display = 'block';
            err.innerText = `CRASH: ${msg} (Line ${line})`;
            return false;
        };

        // --- 1. CORE WEBGL MATH ---
        // We write our own matrix math to completely avoid external libraries
        const Math3D = {
            createMatrix: () => new Float32Array(16),
            identity: (m) => {
                for(let i=0; i<16; i++) m[i] = (i%5 === 0) ? 1 : 0;
                return m;
            },
            perspective: (m, fov, aspect, near, far) => {
                const f = 1.0 / Math.tan(fov / 2);
                const nf = 1 / (near - far);
                m[0] = f / aspect; m[1] = 0; m[2] = 0; m[3] = 0;
                m[4] = 0; m[5] = f; m[6] = 0; m[7] = 0;
                m[8] = 0; m[9] = 0; m[10] = (far + near) * nf; m[11] = -1;
                m[12] = 0; m[13] = 0; m[14] = (2 * far * near) * nf; m[15] = 0;
            },
            multiply: (out, a, b) => {
                for(let i=0; i<4; i++) {
                    for(let j=0; j<4; j++) {
                        out[i*4+j] = a[i*4+0]*b[0*4+j] + a[i*4+1]*b[1*4+j] + a[i*4+2]*b[2*4+j] + a[i*4+3]*b[3*4+j];
                    }
                }
            },
            translate: (m, x, y, z) => {
                m[12] += m[0]*x + m[4]*y + m[8]*z;
                m[13] += m[1]*x + m[5]*y + m[9]*z;
                m[14] += m[2]*x + m[6]*y + m[10]*z;
                m[15] += m[3]*x + m[7]*y + m[11]*z;
            },
            rotateY: (m, angle) => {
                const s = Math.sin(angle), c = Math.cos(angle);
                const m00 = m[0], m01 = m[1], m02 = m[2], m03 = m[3];
                const m80 = m[8], m81 = m[9], m82 = m[10], m83 = m[11];
                m[0] = m00*c + m80*-s; m[1] = m01*c + m81*-s; m[2] = m02*c + m82*-s; m[3] = m03*c + m83*-s;
                m[8] = m00*s + m80*c; m[9] = m01*s + m81*c; m[10] = m02*s + m82*c; m[11] = m03*s + m83*c;
            },
            rotateX: (m, angle) => {
                const s = Math.sin(angle), c = Math.cos(angle);
                const m40 = m[4], m41 = m[5], m42 = m[6], m43 = m[7];
                const m80 = m[8], m81 = m[9], m82 = m[10], m83 = m[11];
                m[4] = m40*c + m80*s; m[5] = m41*c + m81*s; m[6] = m42*c + m82*s; m[7] = m43*c + m83*s;
                m[8] = m40*-s + m80*c; m[9] = m41*-s + m81*c; m[10] = m42*-s + m82*c; m[11] = m43*-s + m83*c;
            }
        };

        // --- 2. SHADERS ---
        // Simple gouraud shading for that classic low-poly 3D feel
        const vsSource = `
            attribute vec4 aVertexPosition;
            attribute vec3 aVertexNormal;
            attribute vec4 aVertexColor;
            
            uniform mat4 uModelViewMatrix;
            uniform mat4 uProjectionMatrix;
            
            varying lowp vec4 vColor;
            varying highp vec3 vLighting;
            
            void main(void) {
                gl_Position = uProjectionMatrix * uModelViewMatrix * aVertexPosition;
                
                highp vec3 ambientLight = vec3(0.3, 0.3, 0.4);
                highp vec3 directionalLightColor = vec3(1, 1, 0.9);
                highp vec3 directionalVector = normalize(vec3(0.85, 0.8, 0.75));
                
                highp mat4 normalMatrix = uModelViewMatrix; 
                highp vec4 transformedNormal = normalMatrix * vec4(aVertexNormal, 0.0);
                
                highp float directional = max(dot(transformedNormal.xyz, directionalVector), 0.0);
                vLighting = ambientLight + (directionalLightColor * directional);
                vColor = aVertexColor;
            }
        `;

        const fsSource = `
            varying lowp vec4 vColor;
            varying highp vec3 vLighting;
            void main(void) {
                gl_FragColor = vec4(vColor.rgb * vLighting, vColor.a);
                
                // Extremely simple distance fog
                highp float depth = gl_FragCoord.z / gl_FragCoord.w;
                highp float fogFactor = smoothstep(20.0, 60.0, depth);
                gl_FragColor = mix(gl_FragColor, vec4(0.5, 0.7, 1.0, 1.0), fogFactor);
            }
        `;

        // --- 3. GEOMETRY GENERATION ---
        let worldVertices = [], worldNormals = [], worldColors = [], worldIndices = [];
        let indexOffset = 0;

        function addBox(x, y, z, w, h, d, r, g, b) {
            const hw=w/2, hh=h/2, hd=d/2;
            const pts = [
                [-hw,-hh,hd], [hw,-hh,hd], [hw,hh,hd], [-hw,hh,hd], // Front
                [-hw,-hh,-hd], [-hw,hh,-hd], [hw,hh,-hd], [hw,-hh,-hd], // Back
                [-hw,hh,-hd], [-hw,hh,hd], [hw,hh,hd], [hw,hh,-hd], // Top
                [-hw,-hh,-hd], [hw,-hh,-hd], [hw,-hh,hd], [-hw,-hh,hd], // Bottom
                [hw,-hh,-hd], [hw,hh,-hd], [hw,hh,hd], [hw,-hh,hd], // Right
                [-hw,-hh,-hd], [-hw,-hh,hd], [-hw,hh,hd], [-hw,hh,-hd]  // Left
            ];
            const norms = [
                [0,0,1], [0,0,-1], [0,1,0], [0,-1,0], [1,0,0], [-1,0,0]
            ];

            for(let face=0; face<6; face++) {
                for(let i=0; i<4; i++) {
                    const p = pts[face*4 + i];
                    worldVertices.push(p[0]+x, p[1]+y, p[2]+z);
                    worldNormals.push(...norms[face]);
                    worldColors.push(r, g, b, 1.0);
                }
                const o = indexOffset;
                worldIndices.push(o, o+1, o+2, o, o+2, o+3);
                indexOffset += 4;
            }
        }

        // --- 4. WORLD BUILDING ---
        function generateWorld() {
            // Ground
            addBox(0, -0.5, 0, 100, 1, 100, 0.3, 0.6, 0.2);
            
            // Village
            addBox(0, 2, -10, 6, 4, 6, 0.8, 0.7, 0.6); // House 1
            addBox(12, 2, -8, 5, 4, 5, 0.7, 0.6, 0.5); // House 2
            addBox(-10, 3, -15, 8, 6, 8, 0.5, 0.5, 0.5); // Big House

            // Trees (Trunk + Leaves)
            for(let i=0; i<30; i++) {
                let tx = (Math.random() - 0.5) * 80;
                let tz = (Math.random() - 0.5) * 80;
                if(Math.abs(tx) < 15 && Math.abs(tz) < 20) continue; // Keep village clear
                
                addBox(tx, 1, tz, 0.8, 2, 0.8, 0.4, 0.2, 0.1); // Trunk
                addBox(tx, 3.5, tz, 3, 3, 3, 0.1, 0.5, 0.2); // Leaves
            }
        }

        // --- 5. INITIALIZE ENGINE ---
        let gl, programInfo, buffers;
        
        function initWebGL() {
            const canvas = document.getElementById('glcanvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            
            if(!gl) throw new Error("WebGL not supported on this device.");

            generateWorld();

            const initShader = (type, source) => {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                return shader;
            };

            const shaderProgram = gl.createProgram();
            gl.attachShader(shaderProgram, initShader(gl.VERTEX_SHADER, vsSource));
            gl.attachShader(shaderProgram, initShader(gl.FRAGMENT_SHADER, fsSource));
            gl.linkProgram(shaderProgram);

            programInfo = {
                program: shaderProgram,
                attribLocations: {
                    vertexPosition: gl.getAttribLocation(shaderProgram, 'aVertexPosition'),
                    vertexNormal: gl.getAttribLocation(shaderProgram, 'aVertexNormal'),
                    vertexColor: gl.getAttribLocation(shaderProgram, 'aVertexColor'),
                },
                uniformLocations: {
                    projectionMatrix: gl.getUniformLocation(shaderProgram, 'uProjectionMatrix'),
                    modelViewMatrix: gl.getUniformLocation(shaderProgram, 'uModelViewMatrix'),
                }
            };

            const createBuffer = (data, type) => {
                const b = gl.createBuffer();
                gl.bindBuffer(type, b);
                gl.bufferData(type, data, gl.STATIC_DRAW);
                return b;
            };

            buffers = {
                position: createBuffer(new Float32Array(worldVertices), gl.ARRAY_BUFFER),
                normal: createBuffer(new Float32Array(worldNormals), gl.ARRAY_BUFFER),
                color: createBuffer(new Float32Array(worldColors), gl.ARRAY_BUFFER),
                indices: createBuffer(new Uint16Array(worldIndices), gl.ELEMENT_ARRAY_BUFFER)
            };
            
            // Clear loading screen
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
        }

        // --- 6. PLAYER CONTROLS ---
        let player = { x: 0, y: 1.5, z: 0, yaw: 0, pitch: 0, vy: 0 };
        const input = { moveX: 0, moveY: 0, lookX: 0, lookY: 0, jump: false };
        let lastTime = 0;

        function initControls() {
            const joyBase = document.getElementById('joystick-base');
            const joyKnob = document.getElementById('joystick-knob');
            
            let activeJoyTouch = null;
            let joyCenter = {x:0, y:0};

            document.getElementById('joystick-zone').addEventListener('pointerdown', e => {
                if(activeJoyTouch !== null) return;
                activeJoyTouch = e.pointerId;
                joyCenter = { x: e.clientX, y: e.clientY };
                joyBase.style.display = 'block';
                joyBase.style.left = e.clientX + 'px';
                joyBase.style.top = e.clientY + 'px';
            });

            document.getElementById('joystick-zone').addEventListener('pointermove', e => {
                if(e.pointerId !== activeJoyTouch) return;
                const max = 40;
                let dx = e.clientX - joyCenter.x;
                let dy = e.clientY - joyCenter.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if(dist > max) { dx = (dx/dist)*max; dy = (dy/dist)*max; }
                
                joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                input.moveX = dx / max;
                input.moveY = dy / max;
            });

            const resetJoy = e => {
                if(e.pointerId === activeJoyTouch) {
                    activeJoyTouch = null;
                    joyBase.style.display = 'none';
                    joyKnob.style.transform = `translate(0px, 0px)`;
                    input.moveX = 0; input.moveY = 0;
                }
            };
            ['pointerup','pointercancel','pointerout'].forEach(evt => document.getElementById('joystick-zone').addEventListener(evt, resetJoy));

            // Camera Swipe
            let activeCamTouch = null, lastCam = {x:0,y:0};
            document.getElementById('camera-zone').addEventListener('pointerdown', e => {
                if(activeCamTouch !== null) return;
                activeCamTouch = e.pointerId;
                lastCam = {x: e.clientX, y: e.clientY};
            });
            document.getElementById('camera-zone').addEventListener('pointermove', e => {
                if(e.pointerId !== activeCamTouch) return;
                player.yaw -= (e.clientX - lastCam.x) * 0.005;
                player.pitch -= (e.clientY - lastCam.y) * 0.005;
                player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch));
                lastCam = {x: e.clientX, y: e.clientY};
            });
            const resetCam = e => { if(e.pointerId === activeCamTouch) activeCamTouch = null; };
            ['pointerup','pointercancel','pointerout'].forEach(evt => document.getElementById('camera-zone').addEventListener(evt, resetCam));

            // Jump
            document.getElementById('btn-jump').addEventListener('pointerdown', () => input.jump = true);
        }

        // --- 7. MAIN LOOP ---
        function drawScene(now) {
            const dt = Math.min((now - lastTime) * 0.001, 0.1);
            lastTime = now;

            // Physics & Movement Update
            if (input.moveY !== 0 || input.moveX !== 0) {
                const speed = 8.0;
                const s = Math.sin(player.yaw), c = Math.cos(player.yaw);
                
                // Move relative to camera look direction
                player.z += (input.moveY * c + input.moveX * s) * speed * dt;
                player.x += (input.moveY * s - input.moveX * c) * speed * dt;
            }

            // Gravity & Jumping
            player.vy -= 20 * dt; 
            player.y += player.vy * dt;
            if(player.y <= 1.5) { 
                player.y = 1.5; 
                player.vy = 0; 
                if(input.jump) { player.vy = 8; input.jump = false; }
            } else {
                input.jump = false;
            }

            // Render Setup
            gl.clearColor(0.5, 0.7, 1.0, 1.0); // Sky color
            gl.clearDepth(1.0);
            gl.enable(gl.DEPTH_TEST);
            gl.depthFunc(gl.LEQUAL);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

            const projMatrix = Math3D.createMatrix();
            Math3D.perspective(projMatrix, 45 * Math.PI / 180, gl.canvas.width / gl.canvas.height, 0.1, 100.0);

            const mvMatrix = Math3D.createMatrix();
            Math3D.identity(mvMatrix);
            
            // First Person Camera view setup
            Math3D.rotateX(mvMatrix, -player.pitch);
            Math3D.rotateY(mvMatrix, -player.yaw);
            Math3D.translate(mvMatrix, -player.x, -player.y, -player.z);

            // Bind Buffers
            const bindA = (buffer, loc, num) => {
                gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
                gl.vertexAttribPointer(loc, num, gl.FLOAT, false, 0, 0);
                gl.enableVertexAttribArray(loc);
            };
            
            bindA(buffers.position, programInfo.attribLocations.vertexPosition, 3);
            bindA(buffers.normal, programInfo.attribLocations.vertexNormal, 3);
            bindA(buffers.color, programInfo.attribLocations.vertexColor, 4);

            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, buffers.indices);
            gl.useProgram(programInfo.program);

            gl.uniformMatrix4fv(programInfo.uniformLocations.projectionMatrix, false, projMatrix);
            gl.uniformMatrix4fv(programInfo.uniformLocations.modelViewMatrix, false, mvMatrix);

            gl.drawElements(gl.TRIANGLES, worldIndices.length, gl.UNSIGNED_SHORT, 0);

            requestAnimationFrame(drawScene);
        }

        // Start 
        window.addEventListener('load', () => {
            setTimeout(() => {
                initWebGL();
                initControls();
                requestAnimationFrame(drawScene);
            }, 100); // Tiny delay to ensure browser gives us canvas width
        });
        
        window.addEventListener('resize', () => {
            if(gl) {
                gl.canvas.width = window.innerWidth;
                gl.canvas.height = window.innerHeight;
                gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
            }
        });
    </script>
</body>
</html>
